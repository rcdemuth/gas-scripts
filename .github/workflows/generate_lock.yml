name: Generate Lock File
on: workflow_dispatch # Allows you to run this manually

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow the bot to push code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Without Cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache is intentionally omitted here so it doesn't crash

      - name: Generate package-lock.json
        run: npm install --package-lock-only

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: auto-generate package-lock.json"
          git push
