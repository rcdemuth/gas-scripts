name: Sync Remote Changes from Apps Script

on:
  schedule:
    # Runs every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sync:
    name: Pull Remote GAS Edits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT_FOR_SUBMODULES || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Clasp globally
        run: npm install -g @google/clasp

      - name: Restore Clasp Credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          mkdir -p ~/.clasprc
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Pull All Script Projects
        run: |
          # Use your runner.js orchestrator to pull every project
          node runner.js pull

      - name: Commit & Push Changes to Private Submodule
        run: |
          cd private_scripts
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected in private scripts! Committing to gas_scripts_private..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Auto-sync: update private scripts from Apps Script web IDE"
            git push origin main
          else
            echo "No changes found in private_scripts."
          fi
          cd ..

      - name: Commit & Push Changes to Public Main Repo
        run: |
          # Check if either gas_scripts or the private_scripts pointer changed
          if [ -n "$(git status --porcelain gas_scripts private_scripts)" ]; then
            echo "Changes detected in public scripts or submodule pointer! Committing to main..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gas_scripts private_scripts
            git commit -m "Auto-sync: update public scripts from Apps Script web IDE [skip ci]"
            git push origin main
          else
            echo "No changes found in public scripts."
          fi